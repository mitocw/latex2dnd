[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex2dnd"
version = "1.4.0"
description = "Generate edX drag-and-drop problems using compilation from latex"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "I. Chuang", email = "ichuang@mit.edu" }]
requires-python = ">=3.10"
dependencies = [
    "lxml",
    "path",
]

[project.optional-dependencies]
test = [
    "pytest",
    "numpy",
    "scipy",
    "pyparsing",
]

[project.urls]
Homepage = "http://pypi.python.org/pypi/latex2dnd/"

[project.scripts]
latex2dnd = "latex2dnd.main:CommandLine"

[tool.setuptools.packages.find]
where = ["."]
include = ["latex2dnd*"]

[tool.setuptools.package-data]
latex2dnd = ["tex/*", "lib/*", "testtex/*"]
